# Krelboyne Go GRUB settings for the installed system (read after /etc/default/grub)
. /etc/krelgo/branding.conf
# One word: grub-install also names the EFI folder after this
GRUB_DISTRIBUTOR="$DISTRO_SHORT"
GRUB_THEME="/boot/grub/themes/krelgo/theme.txt"
GRUB_BACKGROUND="/boot/grub/themes/krelgo/background.jpg"
# Show the boot splash; keep whatever else the installer added (resume=, etc.)
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash" ;;
esac
